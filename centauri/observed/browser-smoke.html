<!doctype html><html lang="en"><meta charset="utf-8"><title>Observed Centauri browser verification</title>
<pre id="result">WAITING</pre>
<iframe id="experiment" src="./index.html" style="width:1000px;height:720px"></iframe>
<script>
const result=document.getElementById("result"),frame=document.getElementById("experiment");
const fail=reason=>{result.textContent="SMOKE_FAIL "+reason;};
async function main(){
  const source=await fetch("./nasa-hst-real.fits");
  if(!source.ok)throw Error("NASA HST FITS fixture not served; status "+source.status);
  const binary=await source.arrayBuffer();
  if(binary.byteLength<100000)throw Error("NASA HST raw FITS fixture unexpectedly short");
  const d=frame.contentDocument, input=d.getElementById("files");
  if(!input)throw Error("photo loader not present");
  const selection=new DataTransfer();
  for(let i=0;i<3;i++)
    selection.items.add(new File([binary],"nasa-hst-identical-reference-"+i+".fits",
      {type:"application/fits"}));
  input.files=selection.files;
  input.dispatchEvent(new Event("change",{bubbles:true}));
  let polls=0,requestedPreviews=false;
  const check=setInterval(()=>{
    polls++;
    const mode=d.getElementById("mode").textContent;
    const notice=d.getElementById("status").textContent;
    if(mode==="READY")d.getElementById("start").click();
    if(mode==="ERROR"||/error|crash|failed/i.test(notice)){
      clearInterval(check);fail("worker: "+notice);return;
    }
    const captures=Number(d.getElementById("snapshots").textContent);
    const frames=Number(d.getElementById("painted").textContent);
    const leaves=Number(d.getElementById("leaf-count").textContent);
    if(captures>=1&&!requestedPreviews){
      d.getElementById("show-qr").click();requestedPreviews=true;
    }
    const qrs=d.querySelectorAll("#qr-list canvas").length;
    if(frames>=3&&captures>=1&&leaves>0&&qrs>0){
      d.getElementById("stop").click();
      clearInterval(check);
      if(d.getElementById("mode").textContent!=="STOPPED")
        fail("STOP did not terminate playback");
      else result.textContent="SMOKE_PASS realNASA=699840-byte-source frames="+frames+
        " qrSnapshots="+captures+" qrImages="+qrs+" tracked="+leaves+
        " timeMode=ordered-frames-no-measured-velocity";
    }else if(polls>300){
      clearInterval(check);
      fail("timeout mode="+mode+" status="+notice+" frames="+frames+
        " captures="+captures+" qrs="+qrs+" leaves="+leaves);
    }
  },100);
}
frame.addEventListener("load",()=>main().catch(e=>fail(e.message)),{once:true});
</script></html>
